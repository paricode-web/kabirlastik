<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" fill="none" role="img" aria-label="Industrial blueprint art" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#0b1a2c"/>
      <stop offset="0.55" stop-color="#0f2238"/>
      <stop offset="1" stop-color="#16314f"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b58a"/>
      <stop offset="0.5" stop-color="#b08a5b"/>
      <stop offset="1" stop-color="#7d5c36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#b08a5b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b08a5b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#b08a5b" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <pattern id="grid2" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" stroke="#b08a5b" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1920" height="800" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1920" height="800" fill="url(#bg)"/>
  <rect width="1920" height="800" fill="url(#glow)"/>

  <g mask="url(#m)">
    <rect width="1920" height="800" fill="url(#grid)"/>
    <rect width="1920" height="800" fill="url(#grid2)"/>

    <!-- Large concentric O-rings -->
    <g transform="translate(520 400)">
      <circle r="300" stroke="url(#bronze)" stroke-width="3"/>
      <circle r="268" stroke="#b08a5b" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="3 9"/>
      <circle r="236" stroke="url(#bronze)" stroke-width="14" stroke-opacity="0.9"/>
      <circle r="236" stroke="#0f2238" stroke-width="4" stroke-opacity="0.6"/>
      <circle r="190" stroke="#b08a5b" stroke-opacity="0.6" stroke-width="1.5"/>
      <circle r="150" stroke="url(#bronze)" stroke-width="8" stroke-opacity="0.8"/>
      <circle r="96" stroke="#b08a5b" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle r="8" fill="url(#bronze)"/>

      <!-- crosshair -->
      <path d="M-340 0H340M0 -340V340" stroke="#b08a5b" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="14 6 2 6"/>

      <!-- tick marks -->
      <g stroke="#b08a5b" stroke-opacity="0.7" stroke-width="2">
        <path id="t" d="M0 -300V-318"/>
        <use href="#t" transform="rotate(15)"/><use href="#t" transform="rotate(30)"/><use href="#t" transform="rotate(45)"/>
        <use href="#t" transform="rotate(60)"/><use href="#t" transform="rotate(75)"/><use href="#t" transform="rotate(90)"/>
        <use href="#t" transform="rotate(105)"/><use href="#t" transform="rotate(120)"/><use href="#t" transform="rotate(135)"/>
        <use href="#t" transform="rotate(150)"/><use href="#t" transform="rotate(165)"/><use href="#t" transform="rotate(180)"/>
        <use href="#t" transform="rotate(195)"/><use href="#t" transform="rotate(210)"/><use href="#t" transform="rotate(225)"/>
        <use href="#t" transform="rotate(240)"/><use href="#t" transform="rotate(255)"/><use href="#t" transform="rotate(270)"/>
        <use href="#t" transform="rotate(285)"/><use href="#t" transform="rotate(300)"/><use href="#t" transform="rotate(315)"/>
        <use href="#t" transform="rotate(330)"/><use href="#t" transform="rotate(345)"/>
      </g>

      <!-- Gear -->
      <g stroke="url(#bronze)" stroke-width="2" stroke-opacity="0.9">
        <circle r="62"/>
        <circle r="40" stroke-opacity="0.6"/>
        <g id="teeth">
          <rect x="-7" y="-80" width="14" height="18" rx="2"/>
          <rect x="-7" y="-80" width="14" height="18" rx="2" transform="rotate(30)"/>
          <rect x="-7" y="-80" width="14" height="18" rx="2" transform="rotate(60)"/>
          <rect x="-7" y="-80" width="14" height="18" rx="2" transform="rotate(90)"/>
          <rect x="-7" y="-80" width="14" height="18" rx="2" transform="rotate(120)"/>
          <rect x="-7" y="-80" width="14" height="18" rx="2" transform="rotate(150)"/>
          <rect x="-7" y="-80" width="14" height="18" rx="2" transform="rotate(180)"/>
          <rect x="-7" y="-80" width="14" height="18" rx="2" transform="rotate(210)"/>
          <rect x="-7" y="-80" width="14" height="18" rx="2" transform="rotate(240)"/>
          <rect x="-7" y="-80" width="14" height="18" rx="2" transform="rotate(270)"/>
          <rect x="-7" y="-80" width="14" height="18" rx="2" transform="rotate(300)"/>
          <rect x="-7" y="-80" width="14" height="18" rx="2" transform="rotate(330)"/>
        </g>
      </g>
    </g>

    <!-- Gasket profile (right of rings) -->
    <g transform="translate(1010 330)" stroke="url(#bronze)" stroke-width="2.5" stroke-linejoin="round">
      <path d="M0 40 C0 -20 80 -60 160 -40 C240 -20 250 50 330 60 C410 70 440 10 420 -50 C410 -90 360 -120 300 -110" stroke-opacity="0.9"/>
      <path d="M20 60 C20 0 90 -40 160 -22 C230 -4 262 70 330 80 C420 92 465 10 440 -62" stroke-opacity="0.45" stroke-dasharray="6 8"/>
      <g fill="#0f2238" stroke-width="2">
        <circle cx="0" cy="40" r="9"/><circle cx="160" cy="-40" r="9"/><circle cx="330" cy="60" r="9"/><circle cx="420" cy="-50" r="9"/>
      </g>
    </g>

    <!-- Dimension lines -->
    <g stroke="#b08a5b" stroke-opacity="0.7" stroke-width="1.2" font-family="monospace" font-size="14" fill="#b08a5b" fill-opacity="0.8">
      <path d="M220 730H820M220 720V740M820 720V740"/>
      <text x="470" y="722" stroke="none">Ø 600</text>
      <path d="M1010 640H1440M1010 630V650M1440 630V650"/>
      <text x="1190" y="632" stroke="none">430 mm</text>
      <path d="M130 100V700M120 100H140M120 700H140"/>
      <text x="100" y="410" stroke="none" transform="rotate(-90 100 410)">ISO 9001 : 2015</text>
    </g>

    <!-- Small accent rings -->
    <g stroke="url(#bronze)" stroke-width="5" stroke-opacity="0.85">
      <circle cx="1130" cy="560" r="44"/><circle cx="1130" cy="560" r="26" stroke-width="1.5" stroke-opacity="0.6"/>
      <circle cx="1290" cy="170" r="30"/><circle cx="1290" cy="170" r="16" stroke-width="1.5" stroke-opacity="0.6"/>
      <circle cx="1450" cy="520" r="56"/><circle cx="1450" cy="520" r="34" stroke-width="1.5" stroke-opacity="0.6"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
